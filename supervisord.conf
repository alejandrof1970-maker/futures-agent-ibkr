[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; Diagnóstico + arranque del gateway
[program:ibgateway]
command=/bin/bash -c "
echo '=== DIAGNÓSTICO GNZSNZ IMAGE ===';
echo '-- /root/ --'; ls /root/ 2>/dev/null;
echo '-- /home/ --'; ls /home/ 2>/dev/null;
echo '-- find run_ib_gateway.sh --';
SCRIPT=$(find / -maxdepth 8 -name 'run_ib_gateway.sh' -type f 2>/dev/null | head -1);
echo 'Encontrado: '$SCRIPT;
if [ -n \"$SCRIPT\" ]; then
  chmod +x \"$SCRIPT\" && \"$SCRIPT\";
else
  echo 'Script no encontrado. Listando .sh en /root y /home:';
  find /root /home /opt -name '*.sh' 2>/dev/null;
  sleep 9999;
fi"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=false
priority=1

; Agente Python (espera 3 min)
[program:agent]
command=python3 /app/main.py
startsecs=180
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
priority=2
