[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; Proceso 1: IB Gateway headless (usa el script del gnzsnz image)
[program:ibgateway]
command=/bin/bash /root/scripts/run_ib_gateway.sh
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
priority=1

; Proceso 2: Agente de futuros (espera 2 min a que Gateway esté listo)
[program:agent]
command=python3 /app/main.py
startsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
priority=2
