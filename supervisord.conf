[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; Proceso 1: IB Gateway (ruta correcta en gnzsnz/ib-gateway)
[program:ibgateway]
command=/home/ibgateway/scripts/run_ib_gateway.sh
user=ibgateway
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
priority=1

; Proceso 2: Agente Python (espera 3 min a que el Gateway autentique)
[program:agent]
command=python3 /app/main.py
startsecs=180
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
priority=2
